[alembic]
script_location = backend/migrations
prepend_sys_path = .
timezone = UTC

# The real URL is loaded from backend.database so local .env.local, .env,
# POS_DATABASE_URL, and DATABASE_URL keep working consistently.
sqlalchemy.url = sqlite:///data/pos_data.sqlite

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
